<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Chivas Regal Mizunara Blended Scotch Whisky Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a22" />
      <stop offset="100%" stop-color="#080d12" />
    </linearGradient>
    <linearGradient id="whisky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#783208" />
      <stop offset="25%" stop-color="#c96b17" />
      <stop offset="50%" stop-color="#e58c28" />
      <stop offset="75%" stop-color="#b85b10" />
      <stop offset="100%" stop-color="#5d2305" />
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3c5c" />
      <stop offset="50%" stop-color="#1b5d8a" />
      <stop offset="100%" stop-color="#0b2c44" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e7428" />
      <stop offset="50%" stop-color="#ebd082" />
      <stop offset="100%" stop-color="#87601c" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="92" ry="14" fill="#000000" opacity="0.5" />

  <!-- Mizunara Indigo-Blue & Gold Neck Foil -->
  <rect x="175" y="28" width="50" height="34" rx="4" fill="url(#indigo)" stroke="url(#gold)" stroke-width="1.2" />
  <path d="M177 62 L223 62 L228 136 L172 136 Z" fill="url(#indigo)" />
  <rect x="172" y="122" width="56" height="6" fill="url(#gold)" />
  <text x="200" y="100" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.2">MIZUNARA</text>

  <!-- Rounded-Shoulder Chivas Bottle -->
  <path d="M172 136 C150 158 122 184 122 232 L126 474 C126 485 136 492 154 492 L246 492 C264 492 274 485 274 474 L278 232 C278 184 250 158 228 136 Z" fill="url(#whisky)" stroke="#f2b258" stroke-opacity="0.33" stroke-width="1.5" />
  <path d="M140 228 L142 470" stroke="#ffd899" stroke-width="6" stroke-linecap="round" opacity="0.28" />
  <path d="M260 228 L258 470" stroke="#3b1302" stroke-width="7" stroke-linecap="round" opacity="0.38" />

  <!-- White & Indigo Mizunara Label -->
  <rect x="134" y="232" width="132" height="178" rx="6" fill="#f7f6f0" stroke="url(#gold)" stroke-width="3" />
  <rect x="140" y="238" width="120" height="166" rx="4" fill="none" stroke="#154d75" stroke-width="1.5" />

  <text x="200" y="264" text-anchor="middle" fill="#154d75" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.6">SPECIAL EDITION</text>
  <text x="200" y="290" text-anchor="middle" fill="#122334" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="1.2">CHIVAS REGAL</text>

  <rect x="146" y="304" width="108" height="46" rx="3" fill="url(#indigo)" stroke="url(#gold)" stroke-width="1.5" />
  <text x="200" y="329" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" letter-spacing="2">MIZUNARA</text>
  <text x="200" y="343" text-anchor="middle" fill="#ebd082" font-family="Georgia, serif" font-size="7" font-weight="700" letter-spacing="1.2">JAPANESE OAK CASK</text>

  <text x="200" y="372" text-anchor="middle" fill="#122334" font-family="Georgia, serif" font-size="8.2" font-weight="700" letter-spacing="1">BLENDED SCOTCH WHISKY</text>
  <text x="200" y="393" text-anchor="middle" fill="#154d75" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.2">CHIVAS BROTHERS · 40% VOL</text>
</svg>
