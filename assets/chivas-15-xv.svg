<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Chivas Regal XV 15 Year Old Blended Scotch Whisky Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1810" />
      <stop offset="100%" stop-color="#0e0b07" />
    </linearGradient>
    <linearGradient id="whisky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#843809" />
      <stop offset="25%" stop-color="#d47619" />
      <stop offset="50%" stop-color="#ee9c2e" />
      <stop offset="75%" stop-color="#c26512" />
      <stop offset="100%" stop-color="#682805" />
    </linearGradient>
    <linearGradient id="xvGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e7422" />
      <stop offset="50%" stop-color="#f2d47e" />
      <stop offset="100%" stop-color="#855d16" />
    </linearGradient>
    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4e101c" />
      <stop offset="50%" stop-color="#78182b" />
      <stop offset="100%" stop-color="#420c17" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="92" ry="14" fill="#000000" opacity="0.5" />

  <!-- Gold Foil Neck -->
  <rect x="175" y="28" width="50" height="34" rx="4" fill="url(#xvGold)" />
  <path d="M177 62 L223 62 L228 136 L172 136 Z" fill="url(#xvGold)" />
  <text x="200" y="102" text-anchor="middle" fill="#2c1d06" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="2">XV</text>

  <!-- Rounded-Shoulder Chivas Bottle -->
  <path d="M172 136 C150 158 122 184 122 232 L126 474 C126 485 136 492 154 492 L246 492 C264 492 274 485 274 474 L278 232 C278 184 250 158 228 136 Z" fill="url(#whisky)" stroke="#f6c76b" stroke-opacity="0.38" stroke-width="1.5" />
  <path d="M140 228 L142 470" stroke="#ffe4a8" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <path d="M260 228 L258 470" stroke="#3d1502" stroke-width="7" stroke-linecap="round" opacity="0.38" />

  <!-- Chivas XV Gold & Burgundy Label -->
  <rect x="134" y="232" width="132" height="178" rx="6" fill="url(#xvGold)" stroke="#3d2707" stroke-width="2.5" />
  <rect x="140" y="238" width="120" height="166" rx="4" fill="none" stroke="#5e1222" stroke-width="1.4" />

  <text x="200" y="264" text-anchor="middle" fill="#4e101c" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.6">AGED 15 YEARS</text>
  <text x="200" y="290" text-anchor="middle" fill="#1f1404" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="1.2">CHIVAS REGAL</text>

  <rect x="148" y="304" width="104" height="48" rx="3" fill="url(#burgundy)" stroke="url(#xvGold)" stroke-width="1.5" />
  <text x="200" y="336" text-anchor="middle" fill="#f5dc93" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="3">XV</text>
  <text x="200" y="348" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="6.5" font-weight="700" letter-spacing="1.2">COGNAC CASK FINISH</text>

  <text x="200" y="373" text-anchor="middle" fill="#1f1404" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1">GRANDE CHAMPAGNE CASKS</text>
  <text x="200" y="394" text-anchor="middle" fill="#4e101c" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.2">BLENDED SCOTCH · 40% VOL</text>
</svg>
