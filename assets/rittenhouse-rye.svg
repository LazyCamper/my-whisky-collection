<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Rittenhouse Straight Rye Whisky Bottled-in-Bond Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1514" />
      <stop offset="100%" stop-color="#0d0909" />
    </linearGradient>
    <linearGradient id="rye" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c2505" />
      <stop offset="25%" stop-color="#bc5811" />
      <stop offset="50%" stop-color="#dc7a1e" />
      <stop offset="75%" stop-color="#aa4b0c" />
      <stop offset="100%" stop-color="#531b03" />
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#521417" />
      <stop offset="50%" stop-color="#7c1f24" />
      <stop offset="100%" stop-color="#471013" />
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5dac4" />
      <stop offset="50%" stop-color="#faf3e3" />
      <stop offset="100%" stop-color="#dacdb4" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e7428" />
      <stop offset="50%" stop-color="#e8c876" />
      <stop offset="100%" stop-color="#87601c" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="86" ry="14" fill="#000000" opacity="0.5" />

  <!-- Maroon BiB Neck Foil -->
  <rect x="176" y="28" width="48" height="34" rx="3" fill="url(#maroon)" stroke="url(#gold)" stroke-width="1.2" />
  <path d="M178 62 L222 62 L226 136 L174 136 Z" fill="url(#maroon)" />
  <text x="200" y="94" text-anchor="middle" fill="#f7e3a8" font-family="Georgia, serif" font-size="7.5" font-weight="700" letter-spacing="1">BOTTLED IN BOND</text>
  <text x="200" y="112" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="1.2">100 PROOF</text>

  <!-- Classic Rye Bottle Body -->
  <path d="M174 136 C166 164 134 184 132 220 L132 474 C132 485 142 492 158 492 L242 492 C258 492 268 485 268 474 L268 220 C266 184 234 164 226 136 Z" fill="url(#rye)" stroke="#f2b258" stroke-opacity="0.33" stroke-width="1.5" />
  <path d="M146 218 L146 470" stroke="#ffd899" stroke-width="6" stroke-linecap="round" opacity="0.28" />
  <path d="M254 218 L254 470" stroke="#3b1302" stroke-width="7" stroke-linecap="round" opacity="0.38" />

  <!-- Rittenhouse Classic Label -->
  <rect x="136" y="226" width="128" height="194" rx="4" fill="url(#cream)" stroke="url(#gold)" stroke-width="3" />
  <rect x="142" y="232" width="116" height="34" fill="url(#maroon)" />
  <text x="200" y="253" text-anchor="middle" fill="#f7e3a8" font-family="Georgia, serif" font-size="10.5" font-weight="700" letter-spacing="1.8">BOTTLED IN BOND</text>

  <text x="200" y="294" text-anchor="middle" fill="#1e1712" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" letter-spacing="0.8">RITTENHOUSE</text>
  <text x="200" y="316" text-anchor="middle" fill="#6e191e" font-family="Georgia, serif" font-size="11.5" font-weight="700" letter-spacing="1.4">STRAIGHT RYE</text>
  <text x="200" y="334" text-anchor="middle" fill="#1e1712" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="2">WHISKY</text>

  <line x1="154" y1="348" x2="246" y2="348" stroke="#6e191e" stroke-width="1.4" />
  <circle cx="200" cy="374" r="16" fill="url(#maroon)" stroke="url(#gold)" stroke-width="1.5" />
  <text x="200" y="378" text-anchor="middle" fill="#f7e3a8" font-family="Georgia, serif" font-size="10" font-weight="700">100</text>
  <text x="200" y="407" text-anchor="middle" fill="#2c2118" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.2">100 PROOF · 50% ALC/VOL</text>
</svg>
