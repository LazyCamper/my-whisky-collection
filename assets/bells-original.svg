<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Bell's Original Blended Scotch Whisky Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1512" />
      <stop offset="100%" stop-color="#0f0b09" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3309" />
      <stop offset="22%" stop-color="#c96f18" />
      <stop offset="50%" stop-color="#e38d25" />
      <stop offset="78%" stop-color="#b85a10" />
      <stop offset="100%" stop-color="#692806" />
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1116" />
      <stop offset="45%" stop-color="#b91c22" />
      <stop offset="100%" stop-color="#6b0d12" />
    </linearGradient>
    <linearGradient id="creamLabel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7dcc6" />
      <stop offset="50%" stop-color="#fbf5e8" />
      <stop offset="100%" stop-color="#dfd2b8" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e7425" />
      <stop offset="50%" stop-color="#e2be63" />
      <stop offset="100%" stop-color="#936a1f" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="495" rx="86" ry="14" fill="#000000" opacity="0.45" />

  <!-- Cap & Neck -->
  <rect x="177" y="34" width="46" height="44" rx="5" fill="url(#cap)" />
  <rect x="177" y="64" width="46" height="6" fill="url(#gold)" />
  <path d="M179 78 L221 78 L225 142 L175 142 Z" fill="url(#glass)" />
  <path d="M177 95 L223 95 L224 128 L176 128 Z" fill="url(#cap)" />
  <text x="200" y="115" text-anchor="middle" fill="#f7e3a3" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.2">AFORE YE GO</text>

  <!-- Bottle Body -->
  <path d="M175 142 C168 165 132 184 130 222 L130 468 C130 482 142 490 160 490 L240 490 C258 490 270 482 270 468 L270 222 C268 184 232 165 225 142 Z" fill="url(#glass)" stroke="#f3b25a" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Bottle Highlights -->
  <path d="M145 220 L145 466" stroke="#ffd899" stroke-width="6" stroke-linecap="round" opacity="0.28" />
  <path d="M255 225 L255 462" stroke="#421602" stroke-width="7" stroke-linecap="round" opacity="0.35" />

  <!-- Embossed Crest Area -->
  <circle cx="200" cy="196" r="16" fill="#9a440d" opacity="0.55" stroke="#f0ab48" stroke-width="1" stroke-opacity="0.45" />

  <!-- Main Label -->
  <rect x="134" y="232" width="132" height="172" rx="4" fill="url(#creamLabel)" stroke="url(#gold)" stroke-width="3" />
  <rect x="139" y="237" width="122" height="162" rx="2" fill="none" stroke="#8f181d" stroke-width="1.2" />

  <text x="200" y="258" text-anchor="middle" fill="#8f181d" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="1.5">ARTHUR BELL &amp; SONS</text>
  <text x="200" y="294" text-anchor="middle" fill="#8f181d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="1.5">BELL'S</text>
  <rect x="150" y="305" width="100" height="20" rx="2" fill="#8f181d" />
  <text x="200" y="319" text-anchor="middle" fill="#fbf5e8" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="2">ORIGINAL</text>

  <text x="200" y="343" text-anchor="middle" fill="#2c1d11" font-family="Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="0.8">BLENDED SCOTCH WHISKY</text>
  <line x1="158" y1="353" x2="242" y2="353" stroke="url(#gold)" stroke-width="1.5" />
  <text x="200" y="369" text-anchor="middle" fill="#6d4c2b" font-family="Georgia, serif" font-style="italic" font-size="10">Arthur Bell &amp; Sons</text>
  <text x="200" y="388" text-anchor="middle" fill="#432c16" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="1">ESTD 1825 · 40% VOL</text>

  <!-- Lower Red Strip Label -->
  <rect x="136" y="420" width="128" height="28" rx="2" fill="#8f181d" stroke="url(#gold)" stroke-width="1.8" />
  <text x="200" y="438" text-anchor="middle" fill="#f7e3a3" font-family="Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="1.4">DISTILLED IN SCOTLAND</text>
</svg>

