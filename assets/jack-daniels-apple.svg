<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Jack Daniel's Tennessee Apple Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171b14" />
      <stop offset="100%" stop-color="#0d0f0b" />
    </linearGradient>
    <linearGradient id="whiskey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e2e07" />
      <stop offset="25%" stop-color="#c36816" />
      <stop offset="50%" stop-color="#df8622" />
      <stop offset="75%" stop-color="#b85b10" />
      <stop offset="100%" stop-color="#5d2304" />
    </linearGradient>
    <linearGradient id="appleGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c8d2f" />
      <stop offset="50%" stop-color="#58b33e" />
      <stop offset="100%" stop-color="#2c6f21" />
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8e2d2" />
      <stop offset="50%" stop-color="#faf6ec" />
      <stop offset="100%" stop-color="#ded6c3" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a7428" />
      <stop offset="50%" stop-color="#dfc06b" />
      <stop offset="100%" stop-color="#8b651e" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="90" ry="14" fill="#000000" opacity="0.48" />

  <!-- Cap & Green Neck Foil -->
  <rect x="176" y="30" width="48" height="34" rx="4" fill="url(#appleGreen)" />
  <path d="M178 64 L222 64 L228 134 L172 134 Z" fill="url(#appleGreen)" />
  <line x1="176" y1="64" x2="224" y2="64" stroke="url(#gold)" stroke-width="2.5" />
  <text x="200" y="102" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1">JACK DANIEL'S</text>
  <path d="M172 134 L228 134 L232 162 L168 162 Z" fill="url(#whiskey)" />

  <!-- Iconic Square Bottle Shoulders & Body -->
  <path d="M168 162 L124 202 L124 476 C124 486 132 492 144 492 L256 492 C268 492 276 486 276 476 L276 202 L232 162 Z" fill="url(#whiskey)" stroke="#f5b864" stroke-opacity="0.32" stroke-width="1.6" />

  <!-- Facet Highlights -->
  <path d="M138 206 L138 474" stroke="#ffd89a" stroke-width="6" stroke-linecap="round" opacity="0.28" />
  <path d="M262 206 L262 474" stroke="#3b1502" stroke-width="7" stroke-linecap="round" opacity="0.35" />
  <path d="M124 202 L200 214 L276 202" fill="none" stroke="#ffd89a" stroke-width="1.5" opacity="0.35" />

  <!-- Main Label -->
  <rect x="132" y="226" width="136" height="206" rx="3" fill="url(#appleGreen)" stroke="url(#gold)" stroke-width="3" />
  <rect x="138" y="232" width="124" height="194" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1" />

  <text x="200" y="264" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.8">JACK DANIEL'S</text>
  <text x="200" y="281" text-anchor="middle" fill="#e6f5dc" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="2">ORIGINAL RECIPE</text>

  <!-- Cream Center Banner -->
  <rect x="142" y="294" width="116" height="76" rx="3" fill="url(#cream)" stroke="url(#gold)" stroke-width="1.8" />
  <text x="200" y="317" text-anchor="middle" fill="#2b5e1e" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="2.2">TENNESSEE</text>
  <text x="200" y="350" text-anchor="middle" fill="#2c6f21" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="1.5">APPLE</text>
  <text x="200" y="364" text-anchor="middle" fill="#4e4637" font-family="Georgia, serif" font-size="7.2" font-weight="700" letter-spacing="0.9">FINEST APPLE LIQUEUR</text>

  <text x="200" y="391" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="0.8">BLENDED WITH JACK DANIEL'S</text>
  <text x="200" y="404" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1">TENNESSEE WHISKEY</text>
  <text x="200" y="419" text-anchor="middle" fill="#e6f5dc" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="1.2">35% ALC/VOL · 70CL</text>
</svg>
