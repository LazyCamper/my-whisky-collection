<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Johnnie Walker Black Ruby Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1218" />
      <stop offset="100%" stop-color="#0f090c" />
    </linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#220c15" />
      <stop offset="28%" stop-color="#4e1629" />
      <stop offset="52%" stop-color="#681c36" />
      <stop offset="78%" stop-color="#3f1121" />
      <stop offset="100%" stop-color="#1b0810" />
    </linearGradient>
    <linearGradient id="rubyLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e1237" />
      <stop offset="50%" stop-color="#9b1b4f" />
      <stop offset="100%" stop-color="#4d0b26" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a67c2e" />
      <stop offset="50%" stop-color="#f1cf80" />
      <stop offset="100%" stop-color="#966d23" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="88" ry="14" fill="#000000" opacity="0.5" />

  <!-- Cap & Neck -->
  <rect x="176" y="28" width="48" height="42" rx="3" fill="url(#rubyLabel)" stroke="url(#gold)" stroke-width="1.2" />
  <rect x="176" y="64" width="48" height="6" fill="url(#gold)" />
  <path d="M178 70 L222 70 L226 144 L174 144 Z" fill="url(# rubyLabel)" />
  <path d="M178 70 L222 70 L226 144 L174 144 Z" fill="url(#darkGlass)" />
  <rect x="176" y="88" width="48" height="34" fill="url(#rubyLabel)" stroke="url(#gold)" stroke-width="1" />
  <text x="200" y="109" text-anchor="middle" fill="#f1cf80" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="1.4">BLACK RUBY</text>

  <!-- Iconic Square Bottle Body -->
  <path d="M174 144 L128 184 L128 476 C128 486 136 492 148 492 L252 492 C264 492 272 486 272 476 L272 184 L226 144 Z" fill="url(#darkGlass)" stroke="#c75b86" stroke-opacity="0.32" stroke-width="1.5" />

  <!-- Facet Highlights -->
  <path d="M140 190 L140 474" stroke="#e487ab" stroke-width="5" stroke-linecap="round" opacity="0.22" />
  <path d="M260 190 L260 474" stroke="#120409" stroke-width="7" stroke-linecap="round" opacity="0.45" />

  <!-- Iconic 24-degree Slanted Label -->
  <g transform="translate(200, 312) rotate(-22)">
    <rect x="-82" y="-56" width="164" height="112" rx="3" fill="url(#rubyLabel)" stroke="url(#gold)" stroke-width="3" />
    <rect x="-76" y="-50" width="152" height="100" rx="2" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="1" />
    <text x="0" y="-24" text-anchor="middle" fill="#f7e3b0" font-family="Georgia, serif" font-size="11.5" font-weight="700" letter-spacing="1.8">JOHNNIE WALKER</text>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="1.4">BLACK RUBY</text>
    <line x1="-52" y1="16" x2="52" y2="16" stroke="url(#gold)" stroke-width="1.4" />
    <text x="0" y="32" text-anchor="middle" fill="#f1cf80" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.4">BLENDED SCOTCH WHISKY</text>
    <text x="0" y="44" text-anchor="middle" fill="#e5b8cf" font-family="Georgia, serif" font-size="7.5" letter-spacing="1">RICH BERRY &amp; SWEET SMOKE</text>
  </g>

  <!-- Striding Man Gold Emblem -->
  <circle cx="200" cy="435" r="16" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.8" />
  <text x="200" y="439" text-anchor="middle" fill="#f1cf80" font-family="Georgia, serif" font-size="10" font-weight="700">JW</text>
</svg>
