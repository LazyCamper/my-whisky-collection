<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="The Glen Grant Arboralis Single Malt Scotch Whisky Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="100%" stop-color="#0f0d0a" />
    </linearGradient>
    <linearGradient id="whisky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e5a14" />
      <stop offset="28%" stop-color="#dfa034" />
      <stop offset="52%" stop-color="#f2be54" />
      <stop offset="76%" stop-color="#cf8a22" />
      <stop offset="100%" stop-color="#84470d" />
    </linearGradient>
    <linearGradient id="bronzeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c6428" />
      <stop offset="50%" stop-color="#dbb66c" />
      <stop offset="100%" stop-color="#7c5520" />
    </linearGradient>
    <linearGradient id="arboralisLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c99b49" />
      <stop offset="50%" stop-color="#e5c278" />
      <stop offset="100%" stop-color="#a8792c" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="82" ry="13" fill="#000000" opacity="0.48" />

  <!-- Tall Slender Glen Grant Capsule & Neck -->
  <rect x="180" y="24" width="40" height="44" rx="3" fill="url(#bronzeGold)" />
  <path d="M180 68 L220 68 L224 128 L176 128 Z" fill="url(#bronzeGold)" />
  <text x="200" y="102" text-anchor="middle" fill="#2d1e0b" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="1.4">EST. 1840</text>

  <!-- Tall Fluted Shoulder & Cylinder Body -->
  <path d="M176 128 C170 156 138 182 136 220 L136 474 C136 485 146 492 162 492 L238 492 C254 492 264 485 264 474 L264 220 C262 182 230 156 224 128 Z" fill="url(#whisky)" stroke="#f6d27a" stroke-opacity="0.38" stroke-width="1.5" />

  <!-- Glass Highlights -->
  <path d="M148 218 L148 470" stroke="#fff0c2" stroke-width="6" stroke-linecap="round" opacity="0.32" />
  <path d="M252 218 L252 470" stroke="#4f2704" stroke-width="6" stroke-linecap="round" opacity="0.35" />

  <!-- Main Bronze-Gold Arboralis Label -->
  <rect x="140" y="236" width="120" height="174" rx="3" fill="url(#arboralisLabel)" stroke="#4a3110" stroke-width="2" />
  <rect x="145" y="241" width="110" height="164" rx="2" fill="none" stroke="#5b3d14" stroke-width="1" opacity="0.65" />

  <text x="200" y="262" text-anchor="middle" fill="#3a250a" font-family="Georgia, serif" font-size="7.5" font-weight="700" letter-spacing="1.6">ROTHES · SPEYSIDE</text>
  <text x="200" y="286" text-anchor="middle" fill="#231505" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="1">THE GLEN GRANT</text>
  <line x1="156" y1="296" x2="244" y2="296" stroke="#4a3110" stroke-width="1.2" />

  <rect x="148" y="308" width="104" height="32" rx="2" fill="#2c1c08" />
  <text x="200" y="329" text-anchor="middle" fill="#f3d692" font-family="Georgia, serif" font-size="15" font-weight="700" letter-spacing="2.2">ARBORALIS</text>

  <text x="200" y="358" text-anchor="middle" fill="#2c1c08" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1">SINGLE MALT</text>
  <text x="200" y="371" text-anchor="middle" fill="#2c1c08" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1">SCOTCH WHISKY</text>
  <text x="200" y="393" text-anchor="middle" fill="#4a3110" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.2">40% ALC/VOL · 700ML</text>
</svg>
