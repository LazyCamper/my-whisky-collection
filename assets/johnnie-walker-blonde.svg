<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Johnnie Walker Blonde Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c14" />
      <stop offset="100%" stop-color="#100f0b" />
    </linearGradient>
    <linearGradient id="goldGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a6412" />
      <stop offset="28%" stop-color="#dfa02c" />
      <stop offset="52%" stop-color="#f3bc46" />
      <stop offset="78%" stop-color="#c9891d" />
      <stop offset="100%" stop-color="#7c4e0a" />
    </linearGradient>
    <linearGradient id="blondeLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7cf3c" />
      <stop offset="50%" stop-color="#ffe164" />
      <stop offset="100%" stop-color="#e3b624" />
    </linearGradient>
    <linearGradient id="royalBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12356b" />
      <stop offset="50%" stop-color="#1c4d99" />
      <stop offset="100%" stop-color="#0f2b57" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="88" ry="14" fill="#000000" opacity="0.46" />

  <!-- Cap & Neck -->
  <rect x="176" y="28" width="48" height="42" rx="3" fill="url(#blondeLabel)" stroke="#1c4d99" stroke-width="1.2" />
  <rect x="176" y="64" width="48" height="6" fill="url(#royalBlue)" />
  <path d="M178 70 L222 70 L226 144 L174 144 Z" fill="url(#goldGlass)" />
  <rect x="176" y="88" width="48" height="34" fill="url(#blondeLabel)" stroke="#1c4d99" stroke-width="1" />
  <text x="200" y="109" text-anchor="middle" fill="#12356b" font-family="Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="1.6">BLONDE</text>

  <!-- Iconic Square Bottle Body -->
  <path d="M174 144 L128 184 L128 476 C128 486 136 492 148 492 L252 492 C264 492 272 486 272 476 L272 184 L226 144 Z" fill="url(#goldGlass)" stroke="#ffe588" stroke-opacity="0.38" stroke-width="1.5" />

  <!-- Facet Highlights -->
  <path d="M140 190 L140 474" stroke="#fff0b3" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <path d="M260 190 L260 474" stroke="#533203" stroke-width="7" stroke-linecap="round" opacity="0.35" />

  <!-- Iconic 24-degree Slanted Label -->
  <g transform="translate(200, 312) rotate(-22)">
    <rect x="-82" y="-56" width="164" height="112" rx="3" fill="url(#blondeLabel)" stroke="#12356b" stroke-width="3" />
    <rect x="-76" y="-50" width="152" height="100" rx="2" fill="none" stroke="#12356b" stroke-opacity="0.45" stroke-width="1" />
    <text x="0" y="-24" text-anchor="middle" fill="#12356b" font-family="Georgia, serif" font-size="11.5" font-weight="700" letter-spacing="1.8">JOHNNIE WALKER</text>
    <text x="0" y="5" text-anchor="middle" fill="#12356b" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="2">BLONDE</text>
    <line x1="-52" y1="17" x2="52" y2="17" stroke="#12356b" stroke-width="1.4" />
    <text x="0" y="33" text-anchor="middle" fill="#12356b" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.3">BLENDED SCOTCH WHISKY</text>
    <text x="0" y="45" text-anchor="middle" fill="#2c4f85" font-family="Georgia, serif" font-size="7.5" font-weight="700" letter-spacing="0.9">BRIGHT VANILLA &amp; BERRY</text>
  </g>
</svg>

