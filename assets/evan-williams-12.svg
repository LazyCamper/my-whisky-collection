<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Evan Williams 12 Year Old Red Label Kentucky Straight Bourbon Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1313" />
      <stop offset="100%" stop-color="#0f0808" />
    </linearGradient>
    <linearGradient id="bourbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e1d03" />
      <stop offset="25%" stop-color="#a8470b" />
      <stop offset="50%" stop-color="#c96314" />
      <stop offset="75%" stop-color="#963b08" />
      <stop offset="100%" stop-color="#471402" />
    </linearGradient>
    <linearGradient id="redLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a1419" />
      <stop offset="50%" stop-color="#b81d24" />
      <stop offset="100%" stop-color="#690e12" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e7428" />
      <stop offset="50%" stop-color="#f2d484" />
      <stop offset="100%" stop-color="#87601c" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="88" ry="14" fill="#000000" opacity="0.5" />

  <!-- Red Wax/Foil Neck & Gold Band -->
  <rect x="176" y="28" width="48" height="34" rx="3" fill="url(#redLabel)" stroke="url(#gold)" stroke-width="1.2" />
  <path d="M178 62 L222 62 L226 138 L174 138 Z" fill="url(#redLabel)" />
  <rect x="174" y="108" width="52" height="22" fill="url(#gold)" />
  <text x="200" y="123" text-anchor="middle" fill="#5e0d10" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1">12 YEARS</text>

  <!-- Square-Shouldered Bourbon Bottle -->
  <path d="M174 138 L128 180 L128 474 C128 485 136 492 150 492 L250 492 C264 492 272 485 272 474 L272 180 L226 138 Z" fill="url(#bourbon)" stroke="#f2b258" stroke-opacity="0.33" stroke-width="1.5" />
  <path d="M142 186 L142 470" stroke="#ffd899" stroke-width="5" stroke-linecap="round" opacity="0.28" />
  <path d="M258 186 L258 470" stroke="#3b1302" stroke-width="7" stroke-linecap="round" opacity="0.42" />

  <!-- Iconic Red Label of Evan Williams 12 -->
  <rect x="134" y="218" width="132" height="202" rx="3" fill="url(#redLabel)" stroke="url(#gold)" stroke-width="3" />
  <rect x="140" y="224" width="120" height="190" rx="2" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.75" />

  <text x="200" y="248" text-anchor="middle" fill="#f2d484" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.4">SINCE 1783</text>
  <text x="200" y="276" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" font-weight="700">Evan Williams</text>

  <rect x="146" y="290" width="108" height="36" rx="2" fill="url(#gold)" />
  <text x="200" y="311" text-anchor="middle" fill="#5e0d10" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="1.5">12 YEARS OLD</text>
  <text x="200" y="322" text-anchor="middle" fill="#2b0708" font-family="Georgia, serif" font-size="6.8" font-weight="700" letter-spacing="1.4">RED LABEL</text>

  <text x="200" y="348" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="8.5" font-weight="700" letter-spacing="1">KENTUCKY STRAIGHT</text>
  <text x="200" y="362" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="9" font-weight="700" letter-spacing="1.2">BOURBON WHISKEY</text>
  <line x1="154" y1="374" x2="246" y2="374" stroke="url(#gold)" stroke-width="1.2" />
  <text x="200" y="396" text-anchor="middle" fill="#f2d484" font-family="Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="1.2">101 PROOF · 50.5% VOL</text>
</svg>
