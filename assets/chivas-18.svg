<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Chivas Regal 18 Year Old Gold Signature Blended Scotch Whisky Bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13161f" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="whisky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#692605" />
      <stop offset="25%" stop-color="#b8560f" />
      <stop offset="50%" stop-color="#d8751b" />
      <stop offset="75%" stop-color="#a8490b" />
      <stop offset="100%" stop-color="#521b03" />
    </linearGradient>
    <linearGradient id="navyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12203b" />
      <stop offset="50%" stop-color="#1e3560" />
      <stop offset="100%" stop-color="#0d172b" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e7428" />
      <stop offset="50%" stop-color="#f0d384" />
      <stop offset="100%" stop-color="#87601c" />
    </linearGradient>
  </defs>

  <rect width="400" height="540" fill="url(#bg)" />
  <ellipse cx="200" cy="498" rx="92" ry="14" fill="#000000" opacity="0.5" />

  <!-- Deep Royal Navy & Gold 18 Neck Foil -->
  <rect x="175" y="28" width="50" height="34" rx="4" fill="url(#navyBlue)" stroke="url(#gold)" stroke-width="1.3" />
  <path d="M177 62 L223 62 L228 136 L172 136 Z" fill="url(#navyBlue)" />
  <rect x="172" y="120" width="56" height="8" fill="url(#gold)" />
  <text x="200" y="98" text-anchor="middle" fill="#f0d384" font-family="Georgia, serif" font-size="11.5" font-weight="700" letter-spacing="1.5">18</text>

  <!-- Rounded-Shoulder Chivas Bottle -->
  <path d="M172 136 C150 158 122 184 122 232 L126 474 C126 485 136 492 154 492 L246 492 C264 492 274 485 274 474 L278 232 C278 184 250 158 228 136 Z" fill="url(#whisky)" stroke="#f2b258" stroke-opacity="0.33" stroke-width="1.5" />
  <path d="M140 228 L142 470" stroke="#ffd899" stroke-width="6" stroke-linecap="round" opacity="0.28" />
  <path d="M260 228 L258 470" stroke="#3b1302" stroke-width="7" stroke-linecap="round" opacity="0.38" />

  <!-- Chivas 18 Royal Navy & Gold Label -->
  <rect x="134" y="232" width="132" height="178" rx="6" fill="url(#navyBlue)" stroke="url(#gold)" stroke-width="3" />
  <rect x="140" y="238" width="120" height="166" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.7" />

  <text x="200" y="264" text-anchor="middle" fill="#f0d384" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.6">GOLD SIGNATURE</text>
  <text x="200" y="290" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="1.2">CHIVAS REGAL</text>

  <rect x="148" y="304" width="104" height="48" rx="3" fill="url(#gold)" />
  <text x="200" y="335" text-anchor="middle" fill="#12203b" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="1.5">18</text>
  <text x="200" y="347" text-anchor="middle" fill="#1e3560" font-family="Georgia, serif" font-size="6.8" font-weight="700" letter-spacing="1.5">AGED 18 YEARS</text>

  <text x="200" y="373" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="8.2" font-weight="700" letter-spacing="1">BLENDED SCOTCH WHISKY</text>
  <text x="200" y="394" text-anchor="middle" fill="#f0d384" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing="1.2">RARE &amp; COMPLEX · 40% VOL</text>
</svg>
